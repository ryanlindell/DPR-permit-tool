<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kailua District Park — Sign Map (Internal)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Kailua District Park — Signs</h1>
      <p class="meta"><span id="count">…</span> signs</p>
    </header>
    <div id="map" role="application" aria-label="Sign locations map"></div>
    <div id="setup" class="setup" hidden>
      <p>Loading map…</p>
    </div>
    <script
      src="config.js"
      onerror="window.__CONFIG_LOAD_ERROR = true"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
